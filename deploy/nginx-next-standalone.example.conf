# Next.js standalone 反代示例（fridgechannels.com）
# 使用方式：按需合并进你的 sites-enabled，并改 ssl 证书路径、upstream 端口。
#
# 常见 404 原因：
# 1) 对 /_next/static 或 /_next/static/media 写了 alias/root，但路径不是「当前运行」那份 .next/static
# 2) try_files 落在静态目录，请求没到 Node
# 3) 只反代了部分路径，/_next 仍走空的 root
#
# 最稳妥：整站动态页与 /_next/*、/homepage/*、/doc/* 全部交给 Node（同一构建 + postbuild）。
#
# 注意：upstream 与 server 须放在 nginx 的 http { } 内；勿把本文件嵌进另一段 server 里导致语法错误。

upstream next_app {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name fridgechannels.com www.fridgechannels.com;

    # 若已上 HTTPS，把 80 改成重定向到 443 即可
    client_max_body_size 32m;

    # 不要为 /_next/static 单独写错误的 alias；统一反代到 Next
    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
